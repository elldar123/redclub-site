name: Validate REDX
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node --check server.js
      - run: node --check redx-rebuild.js
      - run: node --check admin.js
      - run: node --check admin-data.js
      - run: node --check loto-server.js
